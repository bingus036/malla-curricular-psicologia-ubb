<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Malla Curricular Psicología</title>

  <style>
    :root {
      --basica: #fff1c1;
      --disciplinaria: #e0f4ff;
      --practica: #fde2e4;
      --integral: #e2f0cb;
      --electivos: #ede7f6;
      --aprobado: #b7e4c7;
      --fondo: #faf7ff;
      --texto: #333;
      --card: rgba(255,255,255,0.85);
    }

    body.dark {
      --fondo: #1f1f2b;
      --texto: #f3f4f6;
      --card: rgba(40,40,60,0.85);
    }

    body {
      font-family: "Poppins","Segoe UI",sans-serif;
      background: var(--fondo);
      color: var(--texto);
      padding: 20px;
      transition: background 0.4s, color 0.4s;
    }

    h1,h2 { text-align: center; }
    h2 { font-weight: 400; font-size: 0.95em; opacity: .8; }

    .toggle {
      display:flex;
      justify-content:center;
      margin: 20px 0;
    }

    .toggle button {
      border:none;
      border-radius:999px;
      padding:8px 16px;
      cursor:pointer;
      background: linear-gradient(90deg,#cdb4db,#ffc8dd);
      transition: transform .2s;
    }

    .toggle button:hover { transform: scale(1.05); }

    .progress-container {
      max-width:900px;
      margin: 0 auto 35px;
    }

    .progress-bar {
      height:20px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
    }

    .progress {
      height:100%;
      width:0%;
      background: linear-gradient(90deg,#cdb4db,#ffc8dd,#ffafcc);
      transition: width .4s;
    }

    .semesters {
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
      gap:26px;
      max-width:1500px;
      margin:auto;
    }

    .semester {
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius:24px;
      padding:18px;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
      animation: fadeIn .6s ease;
    }

    @keyframes fadeIn {
      from { opacity:0; transform: translateY(8px); }
      to { opacity:1; transform: translateY(0); }
    }

    .semester h3 {
      text-align:center;
      margin-bottom:14px;
    }

    .course {
      border-radius:18px;
      padding:12px 14px;
      margin-bottom:12px;
      cursor:pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,.08);
      transition: transform .2s, box-shadow .2s, opacity .2s;
      position:relative;
    }

    .course:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
    }

    .course.completed { background: var(--aprobado) !important; }
    .course.locked { opacity:.4; cursor:not-allowed; }

    .credits { font-size:.75em; margin-top:6px; }

    .tooltip {
      position:absolute;
      bottom:110%;
      left:50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color:#fff;
      padding:6px 10px;
      border-radius:10px;
      font-size:.7em;
      white-space:nowrap;
      opacity:0;
      pointer-events:none;
      transition: opacity .2s, transform .2s;
    }

    .course:hover .tooltip {
      opacity:1;
      transform: translate(-50%,-4px);
    }

    .legend {
      max-width:1000px;
      margin:35px auto 10px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      font-size:.8em;
    }

    .legend span {
      padding:6px 12px;
      border-radius:999px;
    }
  </style>
</head>

<body>

<h1>🧠 Psicología</h1>
<h2>Malla curricular · 10 semestres · Créditos SCT</h2>

<div class="toggle">
  <button onclick="toggleDark()">🌙 Modo oscuro</button>
</div>

<div class="progress-container">
  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>
</div>

<div class="semesters" id="semesters"></div>

<div class="legend">
  <span style="background:var(--basica)">💛 Formación Básica</span>
  <span style="background:var(--disciplinaria)">💙 Formación Disciplinaria</span>
  <span style="background:var(--practica)">🩷 Formación Práctica</span>
  <span style="background:var(--integral)">💚 Formación Integral</span>
  <span style="background:var(--electivos)">💜 Electivos</span>
</div>

<script>
const courses = [
  {id:1,name:"Historia y Fundamentos de la Psicología",semester:1,credits:6,area:"basica",prereq:[]},
  {id:2,name:"Psicobiología",semester:1,credits:7,area:"basica",prereq:[]},
  {id:3,name:"Taller de Desarrollo Personal I",semester:1,credits:3,area:"basica",prereq:[]},
  {id:4,name:"Socioantropología",semester:1,credits:6,area:"basica",prereq:[]},
  {id:5,name:"Procesos Psicológicos",semester:1,credits:6,area:"basica",prereq:[]},
  {id:6,name:"Oferta Institucional",semester:1,credits:2,area:"integral",prereq:[]},

  {id:7,name:"Epistemología",semester:2,credits:6,area:"basica",prereq:[]},
  {id:8,name:"Neuropsicología",semester:2,credits:7,area:"basica",prereq:[]},
  {id:9,name:"Taller de Desarrollo Personal II",semester:2,credits:3,area:"basica",prereq:[]},
  {id:10,name:"Teoría y Sistemas Psicológicos",semester:2,credits:6,area:"basica",prereq:[]},
  {id:11,name:"Psicología del Desarrollo I",semester:2,credits:6,area:"disciplinaria",prereq:[5]},
  {id:12,name:"Oferta Institucional",semester:2,credits:2,area:"integral",prereq:[]},

  {id:13,name:"Ética Profesional",semester:3,credits:3,area:"basica",prereq:[]},
  {id:14,name:"Psicoestadística",semester:3,credits:5,area:"basica",prereq:[]},
  {id:15,name:"Psicología de la Personalidad",semester:3,credits:6,area:"disciplinaria",prereq:[]},
  {id:16,name:"Psicología Social I",semester:3,credits:5,area:"disciplinaria",prereq:[]},
  {id:17,name:"Psicología del Desarrollo II",semester:3,credits:6,area:"disciplinaria",prereq:[11]},
  {id:18,name:"Inglés Comunicacional I",semester:3,credits:4,area:"integral",prereq:[]},

  {id:19,name:"Evaluación de Procesos Socioafectivos",semester:4,credits:5,area:"disciplinaria",prereq:[15]},
  {id:20,name:"Evaluación de Procesos Cognitivos",semester:4,credits:5,area:"disciplinaria",prereq:[14]},
  {id:21,name:"Psicología de la Familia",semester:4,credits:5,area:"disciplinaria",prereq:[]},
  {id:22,name:"Psicología Social II",semester:4,credits:6,area:"disciplinaria",prereq:[16]},
  {id:23,name:"Psicología Clínica",semester:4,credits:6,area:"disciplinaria",prereq:[15,17]},
  {id:24,name:"Inglés Comunicacional II",semester:4,credits:4,area:"integral",prereq:[18]},
];

let completed = JSON.parse(localStorage.getItem("completed")||"[]");

function toggleDark(){
  document.body.classList.toggle("dark");
}

function canUnlock(course){
  return course.prereq.every(p => completed.includes(p));
}

function render(){
  const container = document.getElementById("semesters");
  container.innerHTML = "";
  for(let s=1;s<=10;s++){
    const box = document.createElement("div");
    box.className="semester";
    box.innerHTML=`<h3>Semestre ${s}</h3>`;
    courses.filter(c=>c.semester===s).forEach(c=>{
      const div=document.createElement("div");
      div.className="course";
      div.style.background=`var(--${c.area})`;
      if(!canUnlock(c)&&!completed.includes(c.id)) div.classList.add("locked");
      if(completed.includes(c.id)) div.classList.add("completed");

      div.onclick=()=>{
        if(div.classList.contains("locked")) return;
        completed.includes(c.id)
          ? completed=completed.filter(i=>i!==c.id)
          : completed.push(c.id);
        localStorage.setItem("completed",JSON.stringify(completed));
        render();
      };

      div.innerHTML=`
        ${c.name}
        <div class="credits">${c.credits} SCT</div>
        ${c.prereq.length?`<div class="tooltip">Prerrequisito pendiente</div>`:""}
      `;
      box.appendChild(div);
    });
    container.appendChild(box);
  }

  const total=courses.reduce((s,c)=>s+c.credits,0);
  const done=courses.filter(c=>completed.includes(c.id)).reduce((s,c)=>s+c.credits,0);
  document.getElementById("progress").style.width=(done/total*100)+"%";
}

render();
</script>

</body>
</html>
