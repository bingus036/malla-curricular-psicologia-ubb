<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malla Psicología</title>

<style>
:root{
  --basica:#fff1c1;
  --disciplinaria:#e0f4ff;
  --practica:#fde2e4;
  --integral:#e2f0cb;
  --electivos:#ede7f6;
  --aprobado:#b7e4c7;
  --fondo:#faf7ff;
  --texto:#333;
  --card:rgba(255,255,255,.85);
}
body.dark{
  --fondo:#1f1f2b;
  --texto:#f3f4f6;
  --card:rgba(40,40,60,.9);
}
body{
  font-family:Poppins,Segoe UI,sans-serif;
  background:var(--fondo);
  color:var(--texto);
  padding:20px;
  transition:.4s;
}
h1,h2{text-align:center}
h2{font-weight:400;font-size:.95em;opacity:.8}

.toggle{display:flex;justify-content:center;margin:15px}
.toggle button{
  border:none;border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
  background:linear-gradient(90deg,#cdb4db,#ffc8dd);
}

.progress-bar{
  max-width:900px;
  margin:0 auto 30px;
  background:#e5e7eb;
  border-radius:999px;
  height:20px;
  overflow:hidden;
}
.progress{height:100%;width:0%;background:linear-gradient(90deg,#cdb4db,#ffc8dd,#ffafcc);transition:.4s}

.semesters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:26px;
  max-width:1600px;
  margin:auto;
}

.semester{
  background:var(--card);
  border-radius:24px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.course{
  border-radius:18px;
  padding:12px 14px;
  margin-bottom:12px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.08);
  transition:.2s;
  position:relative;
}
.course:hover{transform:translateY(-4px)}
.course.completed{background:var(--aprobado)!important}
.course.locked{opacity:.4;cursor:not-allowed}

.credits{font-size:.75em;margin-top:6px}

.tooltip{
  position:absolute;
  bottom:110%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:6px 10px;
  border-radius:10px;
  font-size:.7em;
  white-space:nowrap;
  opacity:0;
  transition:.2s;
}
.course:hover .tooltip{opacity:1}
</style>
</head>

<body>

<h1>🧠 Psicología</h1>
<h2>Malla curricular · 10 semestres · SCT</h2>

<div class="toggle">
<button onclick="toggleDark()">🌙 Modo oscuro</button>
</div>

<div class="progress-bar"><div class="progress" id="progress"></div></div>
<div class="semesters" id="semesters"></div>

<script>
const courses=[
/* SEM 1 */
{id:1,n:"Historia y Fundamentos de la Psicología",s:1,c:6,a:"basica",p:[]},
{id:2,n:"Psicobiología",s:1,c:7,a:"basica",p:[]},
{id:3,n:"Taller de Desarrollo Personal I",s:1,c:3,a:"basica",p:[]},
{id:4,n:"Socioantropología",s:1,c:6,a:"basica",p:[]},
{id:5,n:"Procesos Psicológicos",s:1,c:6,a:"basica",p:[]},
{id:6,n:"Oferta Institucional",s:1,c:2,a:"integral",p:[]},

/* SEM 2 */
{id:7,n:"Epistemología",s:2,c:6,a:"basica",p:[]},
{id:8,n:"Neuropsicología",s:2,c:7,a:"basica",p:[]},
{id:9,n:"Taller de Desarrollo Personal II",s:2,c:3,a:"basica",p:[]},
{id:10,n:"Teoría y Sistemas Psicológicos",s:2,c:6,a:"basica",p:[]},
{id:11,n:"Psicología del Desarrollo I",s:2,c:6,a:"disciplinaria",p:[5]},
{id:12,n:"Oferta Institucional",s:2,c:2,a:"integral",p:[]},

/* SEM 3 */
{id:13,n:"Ética Profesional",s:3,c:3,a:"basica",p:[]},
{id:14,n:"Psicoestadística",s:3,c:5,a:"basica",p:[]},
{id:15,n:"Psicología de la Personalidad",s:3,c:6,a:"disciplinaria",p:[]},
{id:16,n:"Psicología Social I",s:3,c:5,a:"disciplinaria",p:[]},
{id:17,n:"Psicología del Desarrollo II",s:3,c:6,a:"disciplinaria",p:[11]},
{id:18,n:"Inglés Comunicacional I",s:3,c:4,a:"integral",p:[]},

/* SEM 4 */
{id:19,n:"Evaluación de Procesos Socioafectivos",s:4,c:5,a:"disciplinaria",p:[15]},
{id:20,n:"Evaluación de Procesos Cognitivos",s:4,c:5,a:"disciplinaria",p:[14]},
{id:21,n:"Psicología de la Familia",s:4,c:5,a:"disciplinaria",p:[]},
{id:22,n:"Psicología Social II",s:4,c:6,a:"disciplinaria",p:[16]},
{id:23,n:"Psicología Clínica",s:4,c:6,a:"disciplinaria",p:[15,17]},
{id:24,n:"Inglés Comunicacional II",s:4,c:4,a:"integral",p:[18]},

/* SEM 5 */
{id:25,n:"Metodología Investigación Cualitativa",s:5,c:6,a:"disciplinaria",p:[7]},
{id:26,n:"Psicología Educacional I",s:5,c:5,a:"disciplinaria",p:[20]},
{id:27,n:"Psicología Organizacional I",s:5,c:5,a:"disciplinaria",p:[16]},
{id:28,n:"Fundamentos Intervención Psicosocial",s:5,c:5,a:"disciplinaria",p:[22]},
{id:29,n:"Psicopatología I",s:5,c:5,a:"disciplinaria",p:[23]},
{id:30,n:"Inglés Comunicacional III",s:5,c:4,a:"integral",p:[24]},

/* SEM 6 */
{id:31,n:"Metodología Investigación Cuantitativa",s:6,c:6,a:"disciplinaria",p:[25,14]},
{id:32,n:"Psicología Educacional II Prepráctica",s:6,c:5,a:"practica",p:[26]},
{id:33,n:"Psicología Organizacional II Prepráctica",s:6,c:5,a:"practica",p:[27]},
{id:34,n:"Psicología Comunitaria I",s:6,c:5,a:"disciplinaria",p:[28]},
{id:35,n:"Psicopatología II",s:6,c:5,a:"disciplinaria",p:[29]},
{id:36,n:"Inglés Comunicacional IV",s:6,c:4,a:"integral",p:[30]},

/* SEM 7 */
{id:37,n:"Actividad de Investigación I",s:7,c:7,a:"disciplinaria",p:[31]},
{id:38,n:"Psicología Educacional III",s:7,c:5,a:"disciplinaria",p:[32]},
{id:39,n:"Psicología Organizacional III",s:7,c:5,a:"disciplinaria",p:[33]},
{id:40,n:"Psicología Comunitaria II Prepráctica",s:7,c:5,a:"practica",p:[34]},
{id:41,n:"Psicoterapia",s:7,c:8,a:"disciplinaria",p:[35]},
{id:42,n:"Formación Integral Extraprogramática",s:7,c:2,a:"integral",p:[]},

/* SEM 8 */
{id:43,n:"Actividad de Investigación II",s:8,c:17,a:"disciplinaria",p:[37]},
{id:44,n:"Integración Clínica Prepráctica",s:8,c:2,a:"practica",p:[41]},
{id:45,n:"Psicoterapia de Grupo",s:8,c:5,a:"disciplinaria",p:[41]},
{id:46,n:"Formación Integral Extraprogramática",s:8,c:2,a:"integral",p:[]},
{id:47,n:"Formación Integral Extraprogramática",s:8,c:2,a:"integral",p:[]},

/* SEM 9 */
{id:48,n:"Práctica Profesional I",s:9,c:22,a:"practica",p:["240"]},
{id:49,n:"Electivo I",s:9,c:4,a:"electivos",p:["240"]},
{id:50,n:"Electivo II",s:9,c:4,a:"electivos",p:["240"]},

/* SEM 10 */
{id:51,n:"Práctica Profesional II",s:10,c:22,a:"practica",p:[48]},
{id:52,n:"Electivo III",s:10,c:4,a:"electivos",p:["240"]},
{id:53,n:"Electivo IV",s:10,c:4,a:"electivos",p:["240"]}
];

let completed=JSON.parse(localStorage.getItem("completed")||"[]");

function toggleDark(){document.body.classList.toggle("dark");}

function creditsDone(){
  return courses.filter(c=>completed.includes(c.id))
    .reduce((s,c)=>s+c.c,0);
}

function canUnlock(c){
  if(c.p.includes("240")) return creditsDone()>=240;
  return c.p.every(p=>completed.includes(p));
}

function render(){
  const cont=document.getElementById("semesters");
  cont.innerHTML="";
  for(let s=1;s<=10;s++){
    const box=document.createElement("div");
    box.className="semester";
    box.innerHTML=`<h3>Semestre ${s}</h3>`;
    courses.filter(c=>c.s===s).forEach(c=>{
      const d=document.createElement("div");
      d.className="course";
      d.style.background=`var(--${c.a})`;
      if(!canUnlock(c)&&!completed.includes(c.id))d.classList.add("locked");
      if(completed.includes(c.id))d.classList.add("completed");

      d.onclick=()=>{
        if(d.classList.contains("locked"))return;
        completed.includes(c.id)
          ? completed=completed.filter(i=>i!==c.id)
          : completed.push(c.id);
        localStorage.setItem("completed",JSON.stringify(completed));
        render();
      };

      d.innerHTML=`${c.n}<div class="credits">${c.c} SCT</div>
      ${c.p.length?`<div class="tooltip">Prerrequisitos pendientes</div>`:""}`;
      box.appendChild(d);
    });
    cont.appendChild(box);
  }

  const total=courses.reduce((s,c)=>s+c.c,0);
  document.getElementById("progress").style.width=(creditsDone()/total*100)+"%";
}
render();
</script>

</body>
</html>
