<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malla Curricular Psicología</title>

  <style>
    :root {
      --basica: #fff1c1;
      --disciplinaria: #e0f4ff;
      --practica: #fde2e4;
      --integral: #e2f0cb;
      --electivos: #ede7f6;
      --aprobado: #b7e4c7;
      --fondo: #faf7ff;
    }

    body {
      font-family: "Poppins", "Segoe UI", sans-serif;
      background: var(--fondo);
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 4px;
    }

    h2 {
      text-align: center;
      font-weight: 400;
      font-size: 0.95em;
      margin-bottom: 28px;
      color: #666;
    }

    /* PROGRESO */
    .progress-container {
      max-width: 900px;
      margin: 0 auto 35px;
    }

    .progress-bar {
      height: 20px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #cdb4db, #ffc8dd, #ffafcc);
      transition: width 0.3s;
    }

    /* SEMESTRES */
    .semesters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 26px;
      max-width: 1500px;
      margin: auto;
    }

    .semester {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }

    .semester h3 {
      text-align: center;
      margin-bottom: 14px;
      font-size: 1em;
    }

    /* RAMOS */
    .course {
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      position: relative;
    }

    .course:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.15);
    }

    .course.completed {
      background: var(--aprobado) !important;
    }

    .course.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .credits {
      font-size: 0.75em;
      margin-top: 6px;
    }

    .tag {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.65em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
    }

    /* LEYENDA */
    .legend {
      max-width: 1000px;
      margin: 35px auto 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      font-size: 0.8em;
    }

    .legend span {
      padding: 6px 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>

<h1>🧠 Psicología</h1>
<h2>Malla curricular oficial · 10 semestres · Créditos SCT</h2>

<div class="progress-container">
  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>
</div>

<div class="semesters" id="semesters"></div>

<div class="legend">
  <span style="background:var(--basica)">💛 Formación Básica</span>
  <span style="background:var(--disciplinaria)">💙 Formación Disciplinaria</span>
  <span style="background:var(--practica)">🩷 Formación Práctica</span>
  <span style="background:var(--integral)">💚 Formación Integral</span>
  <span style="background:var(--electivos)">💜 Electivos</span>
</div>

<script>
  const courses = [
    // SEMESTRE 1
    { id: 1, name: "Historia y Fundamentos de la Psicología", semester: 1, credits: 6, area: "basica", prereq: [] },
    { id: 2, name: "Psicobiología", semester: 1, credits: 7, area: "basica", prereq: [] },
    { id: 3, name: "Taller de Desarrollo Personal I", semester: 1, credits: 3, area: "basica", prereq: [] },
    { id: 4, name: "Socioantropología", semester: 1, credits: 6, area: "basica", prereq: [] },
    { id: 5, name: "Procesos Psicológicos", semester: 1, credits: 6, area: "basica", prereq: [] },
    { id: 6, name: "Oferta Institucional", semester: 1, credits: 2, area: "integral", prereq: [] },

    // SEMESTRE 2
    { id: 7, name: "Epistemología", semester: 2, credits: 6, area: "basica", prereq: [] },
    { id: 8, name: "Neuropsicología", semester: 2, credits: 7, area: "basica", prereq: [] },
    { id: 9, name: "Taller de Desarrollo Personal II", semester: 2, credits: 3, area: "basica", prereq: [] },
    { id: 10, name: "Teoría y Sistemas Psicológicos", semester: 2, credits: 6, area: "basica", prereq: [] },
    { id: 11, name: "Psicología del Desarrollo I", semester: 2, credits: 6, area: "disciplinaria", prereq: [5] },
    { id: 12, name: "Oferta Institucional", semester: 2, credits: 2, area: "integral", prereq: [] },

    // SEMESTRE 3
    { id: 13, name: "Ética Profesional", semester: 3, credits: 3, area: "basica", prereq: [] },
    { id: 14, name: "Psicoestadística", semester: 3, credits: 5, area: "basica", prereq: [] },
    { id: 15, name: "Psicología de la Personalidad", semester: 3, credits: 6, area: "disciplinaria", prereq: [] },
    { id: 16, name: "Psicología Social I", semester: 3, credits: 5, area: "disciplinaria", prereq: [] },
    { id: 17, name: "Psicología del Desarrollo II", semester: 3, credits: 6, area: "disciplinaria", prereq: [11] },
    { id: 18, name: "Inglés Comunicacional I (FIP)", semester: 3, credits: 4, area: "integral", prereq: [] },

    // SEMESTRE 4
    { id: 19, name: "Evaluación de Procesos Socioafectivos", semester: 4, credits: 5, area: "disciplinaria", prereq: [15] },
    { id: 20, name: "Evaluación de Procesos Cognitivos", semester: 4, credits: 5, area: "disciplinaria", prereq: [14] },
    { id: 21, name: "Psicología de la Familia", semester: 4, credits: 5, area: "disciplinaria", prereq: [] },
    { id: 22, name: "Psicología Social II", semester: 4, credits: 6, area: "disciplinaria", prereq: [16] },
    { id: 23, name: "Psicología Clínica", semester: 4, credits: 6, area: "disciplinaria", prereq: [17,15] },
    { id: 24, name: "Inglés Comunicacional II (FIP)", semester: 4, credits: 4, area: "integral", prereq: [18] },

    // SEMESTRE 5
    { id: 25, name: "Metodología de la Investigación Cualitativa", semester: 5, credits: 6, area: "disciplinaria", prereq: [7] },
    { id: 26, name: "Psicología Educacional I", semester: 5, credits: 5, area: "disciplinaria", prereq: [20] },
    { id: 27, name: "Psicología Organizacional", semester: 5, credits: 5, area: "disciplinaria", prereq: [16] },
    { id: 28, name: "Fundamentos de la Intervención Psicosocial", semester: 5, credits: 5, area: "disciplinaria", prereq: [22] },
    { id: 29, name: "Psicopatología I", semester: 5, credits: 5, area: "disciplinaria", prereq: [23] },
    { id: 30, name: "Inglés Comunicacional III (FIP)", semester: 5, credits: 4, area: "integral", prereq: [24] },

    // SEMESTRE 6
    { id: 31, name: "Metodología de la Investigación Cuantitativa", semester: 6, credits: 6, area: "disciplinaria", prereq: [25,14] },
    { id: 32, name: "Psicología Educacional II Prepráctica", semester: 6, credits: 5, area: "practica", prereq: [26] },
    { id: 33, name: "Psicología Organizacional II Prepráctica", semester: 6, credits: 5, area: "practica", prereq: [27] },
    { id: 34, name: "Psicología Comunitaria I", semester: 6, credits: 5, area: "disciplinaria", prereq: [28] },
    { id: 35, name: "Psicopatología II", semester: 6, credits: 5, area: "disciplinaria", prereq: [29] },
    { id: 36, name: "Inglés Comunicacional IV (FIP)", semester: 6, credits: 4, area: "integral", prereq: [30] },

    // SEMESTRE 7
    { id: 37, name: "Actividad de Investigación I", semester: 7, credits: 7, area: "disciplinaria", prereq: [31] },
    { id: 38, name: "Psicología Educacional III", semester: 7, credits: 5, area: "disciplinaria", prereq: [32] },
    { id: 39, name: "Psicología Organizacional III", semester: 7, credits: 5, area: "disciplinaria", prereq: [33] },
    { id: 40, name: "Psicología Comunitaria II Prepráctica", semester: 7, credits: 5, area: "practica", prereq: [34] },
    { id: 41, name: "Psicoterapia", semester: 7, credits: 8, area: "disciplinaria", prereq: [35] },
    { id: 42, name: "Formación Integral en Actividades Extraprogramáticas", semester: 7, credits: 2, area: "integral", prereq: [] },

    // SEMESTRE 8
    { id: 43, name: "Actividad de Investigación II", semester: 8, credits: 17, area: "disciplinaria", prereq: [37] },
    { id: 44, name: "Integración Clínica Prepráctica", semester: 8, credits: 2, area: "practica", prereq: [41] },
    { id: 45, name: "Psicoterapia de Grupo", semester: 8, credits: 5, area: "disciplinaria", prereq: [41] },
    { id: 46, name: "Formación Integral en Actividades Extraprogramáticas", semester: 8, credits: 2, area: "integral", prereq: [] },
    { id: 47, name: "Formación Integral en Actividades Extraprogramáticas", semester: 8, credits: 2, area: "integral", prereq: [] },

    // SEMESTRE 9
    { id: 48, name: "Práctica Profesional I", semester: 9, credits: 22, area: "practica", prereq: [] },
    { id: 49, name: "Electivo I", semester: 9, credits: 4, area: "electivos", prereq: [] },
    { id: 50, name: "Electivo II", semester: 9, credits: 4, area: "electivos", prereq: [] },

    // SEMESTRE 10
    { id: 51, name: "Práctica Profesional II", semester: 10, credits: 22, area: "practica", prereq: [48] },
    { id: 52, name: "Electivo III", semester: 10, credits: 4, area: "electivos", prereq: [] },
    { id: 53, name: "Electivo IV", semester: 10, credits: 4, area: "electivos", prereq: [] }
  ];

  const semestersDiv = document.getElementById("semesters");
  const progressBar = document.getElementById("progress");
  let completed = JSON.parse(localStorage.getItem("completed")) || [];

  function canUnlock(course) {
    // Prerrequisitos por ramos
    const courseReqsMet = course.prereq
      .filter(p => typeof p === "number")
      .every(p => completed.includes(p));

    // Prerrequisito por créditos SCT (ej: 240 SCT aprobados)
    const creditReq = course.prereq.find(p => typeof p === "string" && p.includes("SCT"));
    if (creditReq) {
      const requiredCredits = parseInt(creditReq);
      const earnedCredits = courses
        .filter(c => completed.includes(c.id))
        .reduce((s, c) => s + c.credits, 0);
      if (earnedCredits < requiredCredits) return false;
    }

    return courseReqsMet;
  }

  function updateProgress() {
    const total = courses.reduce((s, c) => s + c.credits, 0);
    const done = courses.filter(c => completed.includes(c.id)).reduce((s, c) => s + c.credits, 0);
    progressBar.style.width = (done / total) * 100 + "%";
    progressBar.title = `${done} / ${total} SCT`;
  }

  function render() {
    semestersDiv.innerHTML = "";
    for (let s = 1; s <= 10; s++) {
      const sem = document.createElement("div");
      sem.className = "semester";
      sem.innerHTML = `<h3>Semestre ${s}</h3>`;

      courses.filter(c => c.semester === s).forEach(course => {
        const div = document.createElement("div");
        div.className = "course";
        div.style.background = `var(--${course.area})`;
        if (!canUnlock(course)) div.classList.add("locked");
        if (completed.includes(course.id)) div.classList.add("completed");

        div.innerHTML = `
          <strong>${course.name}</strong>
          <div class="credits">${course.credits} SCT</div>
          <span class="tag">${course.area}</span>
        `;

        div.onclick = () => {
          if (!canUnlock(course)) return;
          completed = completed.includes(course.id)
            ? completed.filter(id => id !== course.id)
            : [...completed, course.id];
          localStorage.setItem("completed", JSON.stringify(completed));
          render();
          updateProgress();
        };
        sem.appendChild(div);
      });
      semestersDiv.appendChild(sem);
    }
  }

  render();
  updateProgress();
</script>

</body>
</html>
